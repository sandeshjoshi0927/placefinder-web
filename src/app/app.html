@if (auth.isAuthenticated()) {
  <header>
    <a class="brand" routerLink="/places">PlaceFinder</a>
    <nav>
      <a routerLink="/profile"> {{ auth.currentUser()?.name }}</a>
      <button type="button" (click)="logout()">Log out</button>
    </nav>
  </header>
}
<main>
  <router-outlet></router-outlet>
</main>
