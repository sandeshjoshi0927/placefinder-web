<div class="place-details">
  @switch (state()) {
    @case ('loading') {
      <p>Loading place…</p>
    }
    @case ('error') {
      <div class="error" role="alert">
        <h2>Place not found</h2>
        <p>The place you're looking for doesn't exist.</p>
        <a routerLink="/places">← Back to places</a>
      </div>
    }
    @case ('loaded') {
      @if (place(); as p) {
        <a class="back" routerLink="/places">&larr; Back to list</a>
        <h1>{{ p.name }}</h1>
        <p class="category">{{ p.category }}</p>
        <p>{{ p.description }}</p>
        <p class="address">{{ p.address }}</p>
        <app-map [lat]="p.lat" [lng]="p.lng" [name]="p.name"></app-map>
      }
    }
  }
</div>
